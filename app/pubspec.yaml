name: smart_collar_tracker
description: Smart Pet Collar Tracker - GPS, BLE, Activity & Health Monitoring
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # BLE
  flutter_blue_plus: ^1.31.7

  # Maps
  google_maps_flutter: ^2.5.3

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP
  dio: ^5.4.0

  # Push Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.0

  # Charts
  fl_chart: ^0.66.0

  # Navigation
  go_router: ^13.0.1

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Permissions
  permission_handler: ^11.2.0

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  local_auth: ^2.1.8

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  geolocator: ^10.1.0
  latlong2: ^0.9.0
  uuid: ^4.3.3
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.2
  crypto: ^3.0.3
  collection: ^1.18.0
  logger: ^2.1.0
  rxdart: ^0.27.7
  web_socket_channel: ^2.4.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  flutter_rating_bar: ^4.0.1
  animate_do: ^3.3.4
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
