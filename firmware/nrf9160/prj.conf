# nRF9160 Smart Pet Collar - Project Configuration

# ── Modem / LTE ────────────────────────────────────────────────────────────
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_INFO_ADD_SIM=y
CONFIG_PDN=y
CONFIG_PDN_DEFAULTS_OVERRIDE=n

# ── MQTT / Cloud ────────────────────────────────────────────────────────────
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_KEEPALIVE=60

# ── Networking ──────────────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

# ── TLS / Security ──────────────────────────────────────────────────────────
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_TLS_VERSION_1_3=y

# ── GNSS ────────────────────────────────────────────────────────────────────
CONFIG_NRF_MODEM_LIB=y

# ── I2C / SPI / GPIO / UART ─────────────────────────────────────────────────
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y

# ── PWM / LED ────────────────────────────────────────────────────────────────
CONFIG_PWM=y
CONFIG_LED=y

# ── Flash ────────────────────────────────────────────────────────────────────
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_NVS=y
CONFIG_NVS_LOG_LEVEL_WRN=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ── JSON ─────────────────────────────────────────────────────────────────────
CONFIG_JSON_LIBRARY=y

# ── Logging ──────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y

# ── Kernel / Threading ───────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── C library ────────────────────────────────────────────────────────────────
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# ── System ───────────────────────────────────────────────────────────────────
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_TIMEOUT_COEFFICIENT=2
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_HW_ID_LIBRARY=y

# ── ADC ──────────────────────────────────────────────────────────────────────
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y

# ── Application Kconfig options ──────────────────────────────────────────────
CONFIG_SMART_COLLAR_GPS_ENABLE=y
CONFIG_SMART_COLLAR_LTE_ENABLE=y
CONFIG_SMART_COLLAR_CLOUD_ENABLE=y
CONFIG_SMART_COLLAR_GEOFENCE_ENABLE=y
CONFIG_SMART_COLLAR_LED_ENABLE=y
CONFIG_SMART_COLLAR_POWER_MGMT=y
CONFIG_SMART_COLLAR_LSM6DSO_ENABLE=y
CONFIG_SMART_COLLAR_ACTIVITY_CLASSIFIER=y
