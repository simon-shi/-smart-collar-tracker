# MCUboot child image configuration for Smart Pet Collar nRF9160.

# ── Signature ────────────────────────────────────────────────────────────────
CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
CONFIG_BOOT_SIGNATURE_KEY_FILE=""

# ── Validation ───────────────────────────────────────────────────────────────
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_BOOT_BOOTSTRAP=n

# ── Upgrade policy ───────────────────────────────────────────────────────────
# Allow revert (swap with revert) so a failed update can roll back.
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_SWAP_USING_MOVE=y

# ── Image slots ──────────────────────────────────────────────────────────────
CONFIG_SINGLE_APPLICATION_SLOT=n

# ── Logging: disable to minimise MCUboot image size ──────────────────────────
CONFIG_LOG=n
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_OFF=y

# ── Serial recovery: disable to save code space ──────────────────────────────
CONFIG_MCUBOOT_SERIAL=n

# ── Boot delay ───────────────────────────────────────────────────────────────
CONFIG_BOOT_DELAY=0

# ── Security counter ─────────────────────────────────────────────────────────
CONFIG_BOOT_HW_ROLLBACK_PROT=n

# ── Fault injection hardening ────────────────────────────────────────────────
CONFIG_FIH_PROFILE_OFF=y

# ── RAM usage ────────────────────────────────────────────────────────────────
CONFIG_BOOT_MAX_IMG_SECTORS=128
