# ============================================================
# Smart Collar nRF52840 – Project Configuration
# Zephyr / nRF Connect SDK v2.7+
# ============================================================

# --------------- Bluetooth LE --------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PetCollar"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SMP=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_SIGNING=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_CONN_CTX_LIB=y

# Standard Profiles
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_MANUF="SmartCollar Inc"
CONFIG_BT_DIS_MODEL="SC-1"
CONFIG_BT_DIS_HW_REV="1.0"
CONFIG_BT_DIS_FW_REV="1.0.0"
CONFIG_BT_DIS_SW_REV="1.0.0"
CONFIG_BT_BAS=y
CONFIG_BT_BAS_NOTIFY_INTERVAL=60

# --------------- MCUmgr / DFU --------------------------------
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_STAT=n
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --------------- Flash / Storage -----------------------------
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NVS=y
CONFIG_NVS_SECTOR_SIZE_MULT=2
CONFIG_NVS_SECTOR_COUNT=4
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --------------- GPIO / UART ---------------------------------
CONFIG_GPIO=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_SERIAL=y

# --------------- USB CDC ACM ---------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_MANUFACTURER="SmartCollar Inc"
CONFIG_USB_DEVICE_PRODUCT="SmartCollar Data"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F

# --------------- Logging -------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=n

# --------------- Kernel / Threading -------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_INIT_STACKS=y

# --------------- Misc ----------------------------------------
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y
CONFIG_NEWLIB_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NVS=y

# --------------- Custom modules ------------------------------
CONFIG_SMART_COLLAR_BLE_ENABLE=y
CONFIG_SMART_COLLAR_DFU_ENABLE=y
CONFIG_SMART_COLLAR_FLASH_ENABLE=y
CONFIG_SMART_COLLAR_CHARGE_ENABLE=y
CONFIG_SMART_COLLAR_BEACON_ENABLE=y
